bump:
  name: Bump fixture camera
  description: Pushes a new map image and state update from the fixture camera.
set_image:
  name: Set fixture image
  description: Changes the PNG the fixture camera serves.
  fields:
    path:
      description: Absolute path inside the HA container.
      example: /config/map_fixture.png
set_rooms:
  name: Set fixture rooms
  description: Swaps the room metadata between the original ids and a re-mapped set.
  fields:
    mode:
      description: shift for the re-mapped ids, reset for the original ids.
      example: shift
vacuum_configure:
  name: Configure fake vacuum
  description: Sets how the fake vacuum misbehaves.
  fields:
    lag:
      description: Seconds before a change of the robot is reported.
      example: 6
    room_seconds:
      description: Seconds the robot spends in each room.
      example: 4
    return_seconds:
      description: Seconds the robot needs to dock after a job.
      example: 3
    fail_next:
      description: Make the next command fail.
      example: true
    available:
      description: Report the entity available or unavailable.
      example: false
vacuum_reset:
  name: Reset fake vacuum
  description: Puts the fake vacuum into an activity at once, without lag.
  fields:
    activity:
      description: docked, cleaning, returning, paused, idle or error.
      example: docked
